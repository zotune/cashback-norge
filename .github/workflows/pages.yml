name: Publish index to Pages

on:
  push:
    branches: [main]
    paths:
      - data/cashback-index.json
      - site/**
      - src/shared/provider-data.ts
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:site
      - run: pnpm run build:userscript

      - name: Prepare pages content
        run: |
          mkdir _site
          cp data/cashback-index.json _site/cashback-index.json
          cp site/* _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
