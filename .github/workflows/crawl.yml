name: Daily crawl

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:backend

      - run: pnpm run crawl
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPERAPI_KEY2: ${{ secrets.SCRAPERAPI_KEY2 }}
          SCRAPERAPI_KEY3: ${{ secrets.SCRAPERAPI_KEY3 }}
          PARTNER_ADS_API_KEY: ${{ secrets.PARTNER_ADS_API_KEY }}
          TRADETRACKER_CUSTOMER_ID: ${{ secrets.TRADETRACKER_CUSTOMER_ID }}
          TRADETRACKER_PASSPHRASE: ${{ secrets.TRADETRACKER_PASSPHRASE }}
          TRADETRACKER_API_KEY: ${{ secrets.TRADETRACKER_API_KEY }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_ACCESS_TOKEN: ${{ secrets.AWIN_ACCESS_TOKEN }}
          AWIN_API_KEY: ${{ secrets.AWIN_API_KEY }}
          ADDREVENUE_API_KEY: ${{ secrets.ADDREVENUE_API_KEY }}
          ADDREVENUE_API_TOKEN: ${{ secrets.ADDREVENUE_API_TOKEN }}
          ADDREVENUE_CHANNEL_ID: ${{ secrets.ADDREVENUE_CHANNEL_ID }}
          ORION_API_KEY: ${{ secrets.ORION_API_KEY }}
          DAISYCON_CLIENT_ID: ${{ secrets.DAISYCON_CLIENT_ID }}
          DAISYCON_CLIENT_SECRET: ${{ secrets.DAISYCON_CLIENT_SECRET }}
          DAISYCON_PUBLISHER_ID: ${{ secrets.DAISYCON_PUBLISHER_ID }}
          DAISYCON_MEDIA_ID: ${{ secrets.DAISYCON_MEDIA_ID }}
          DAISYCON_REFRESH_TOKEN: ${{ secrets.DAISYCON_REFRESH_TOKEN }}
          DAISYCON_REFRESH_TOKEN_FILE: ${{ runner.temp }}/daisycon-refresh-token.txt
          TRADEDOUBLER_API_KEY: ${{ secrets.TRADEDOUBLER_API_KEY }}
          TRADEDOUBLER_CLIENT_SECRET: ${{ secrets.TRADEDOUBLER_CLIENT_SECRET }}
          TRADEDOUBLER_USER: ${{ secrets.TRADEDOUBLER_USER }}
          TRADEDOUBLER_PASSWORD: ${{ secrets.TRADEDOUBLER_PASSWORD }}
          TRADEDOUBLER_SOURCE_ID: ${{ secrets.TRADEDOUBLER_SOURCE_ID }}

      # Daisycon invalidates used refresh tokens after a short grace period,
      # so the rotated token must be written back to the secret. Needs a
      # fine-grained PAT with Secrets write access (DAISYCON_SECRETS_PAT);
      # the default GITHUB_TOKEN cannot update repository secrets.
      - name: Persist rotated Daisycon refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DAISYCON_SECRETS_PAT }}
          TOKEN_FILE: ${{ runner.temp }}/daisycon-refresh-token.txt
        run: |
          if [ ! -s "$TOKEN_FILE" ]; then
            echo "No rotated token to persist"
          elif [ -z "$GH_TOKEN" ]; then
            echo "::warning::Daisycon refresh token rotated but DAISYCON_SECRETS_PAT is not set; the next run will fail to authenticate"
          else
            gh secret set DAISYCON_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$TOKEN_FILE"
            echo "DAISYCON_REFRESH_TOKEN secret updated"
          fi
          rm -f "$TOKEN_FILE"

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force data/cashback-index.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update cashback index $(date -u +%Y-%m-%d)"
            git push
          fi

      - run: pnpm run build:site
      - run: pnpm run build:userscript

      - name: Prepare pages content
        run: |
          mkdir _site
          cp -R site/* _site/
          cp data/cashback-index.json _site/cashback-index.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
