name: Daily crawl

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:backend

      - run: pnpm run crawl
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPERAPI_KEY2: ${{ secrets.SCRAPERAPI_KEY2 }}
          PARTNER_ADS_API_KEY: ${{ secrets.PARTNER_ADS_API_KEY }}
          TRADETRACKER_CUSTOMER_ID: ${{ secrets.TRADETRACKER_CUSTOMER_ID }}
          TRADETRACKER_PASSPHRASE: ${{ secrets.TRADETRACKER_PASSPHRASE }}
          TRADETRACKER_API_KEY: ${{ secrets.TRADETRACKER_API_KEY }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_ACCESS_TOKEN: ${{ secrets.AWIN_ACCESS_TOKEN }}
          AWIN_API_KEY: ${{ secrets.AWIN_API_KEY }}
          ADDREVENUE_API_KEY: ${{ secrets.ADDREVENUE_API_KEY }}
          ADDREVENUE_API_TOKEN: ${{ secrets.ADDREVENUE_API_TOKEN }}
          ADDREVENUE_CHANNEL_ID: ${{ secrets.ADDREVENUE_CHANNEL_ID }}

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force data/cashback-index.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update cashback index $(date -u +%Y-%m-%d)"
            git push
          fi

      - run: pnpm run build:site
      - run: pnpm run build:userscript

      - name: Prepare pages content
        run: |
          mkdir _site
          cp -R site/* _site/
          cp data/cashback-index.json _site/cashback-index.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
