name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:site

      - run: pnpm run build:userscript

      - name: Prepare pages content
        run: |
          mkdir _site
          cp -R site/* _site/
          cp data/cashback-index.json _site/cashback-index.json
          # Built by the daily crawl and not committed; keep the published copy for /dagligvarer.
          curl -fsSL --retry 2 https://cashbacknorge.no/grocery-offers.json -o _site/grocery-offers.json || echo "::warning::grocery-offers.json could not be fetched; /dagligvarer shows an error until the next Daily crawl"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
