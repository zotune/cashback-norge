name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-site.yml"
      - "data/cashback-index.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "site/**"
      - "src/**"
      - "vite.site.config.ts"
      - "vite.userscript.config.ts"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:site

      - run: pnpm run build:userscript

      - name: Prepare pages content
        run: |
          mkdir _site
          cp data/cashback-index.json _site/cashback-index.json
          cp site/* _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
