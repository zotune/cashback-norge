<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../shared/reel.css">
<style>
  #panel, #sum, #tip { will-change: transform; }
  .screen .layer.st { opacity: 0; }
  .label { position: absolute; left: 50%; top: 300px; z-index: 62; background: #fff; color: var(--ink); font-weight: 900; font-size: 56px; padding: 18px 40px; border-radius: 28px; box-shadow: 0 14px 40px rgba(0,0,0,.4); white-space: nowrap; opacity: 0; text-align: center; }
  .label small { display: block; font-size: 36px; font-weight: 800; color: #6d28d9; margin-top: 6px; }
  .flash { position: absolute; inset: 0; background: #fff; z-index: 55; opacity: 0; pointer-events: none; }
  .bday { position: absolute; left: 50%; z-index: 62; background: #7c3aed; color: #fff; font-weight: 900; font-size: 50px; padding: 16px 36px; border-radius: 999px; box-shadow: 0 14px 40px rgba(0,0,0,.4); white-space: nowrap; opacity: 0; }
  .fineprint { bottom: 230px; left: 60px; right: 60px; background: rgba(4,20,14,.78); border-radius: 18px; padding: 12px 18px; color: #fff; }
  
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div><div class="bg-grid"></div>
  <div id="cam">
    <div class="phone">
      <div class="screen">
        <div class="layer" id="g0"><img src="assets/guide-0.png"></div>
        <div class="layer st" id="g1"><img src="assets/guide-1.png"></div>
        <div class="layer st" id="g2"><img src="assets/guide-2.png"></div>
        <div class="layer st" id="g4"><img src="assets/guide-4.png"></div>
        <div class="layer st" id="shop"><img src="assets/glitter.png"></div>
      </div>
    </div>
  </div>
  <div class="flash"></div>
  <div class="dim"></div>

  <div class="sticker" id="hook" style="top:300px">Har du Android? 🤖<br>Nå <span class="hl">funker</span> det 🎉</div>
  <div class="label" id="l1">1️⃣ Firefox</div>
  <div class="label" id="l2">2️⃣ Tampermonkey</div>
  <div class="label" id="l3">3️⃣ Cashback Norge</div>
  <div class="label" id="l4">✅ Klar!</div>
  <div class="label" id="l5">🎂 Glitter −25 %<small>Bursdagsrabatt · kundeklubb</small></div>

  <div class="captions"></div>

  <div class="endcard" id="end">
    <img class="logo" src="../../../../site/logo.png">
    <div class="url">cashback<b>norge</b>.no</div>
    <div class="tag" id="free">Gratis · ingen innlogging ✅</div>
    <div class="pills">
      <div class="pill" id="p1">🤖 Android · Firefox</div>
      <div class="pill" id="p2">🔄 Oppdateres automatisk</div>
      <div class="pill cta" id="p3">👆 Lenke i bio</div>
    </div>
  </div>
</div>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../shared/reel.js"></script>
<script src="scene.js"></script>
</body>
</html>
