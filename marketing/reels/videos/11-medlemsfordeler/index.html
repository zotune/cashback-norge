<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../shared/reel.css">
<style>
  #panel { will-change: transform; }
  .chip { position: absolute; left: 50%; z-index: 62; background: var(--green); color: #fff; font-weight: 900; font-size: 46px; padding: 16px 34px; border-radius: 999px; box-shadow: 0 14px 40px rgba(0,0,0,.4); white-space: nowrap; display: flex; align-items: center; gap: 14px; }
  .chip img { width: 58px; height: 58px; }
  .wall { position: absolute; left: 50px; right: 50px; top: 250px; z-index: 64; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 12px; }
  .wall h3 { width: 100%; text-align: center; font-weight: 900; font-size: 58px; margin-bottom: 10px; text-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .b { font: 800 32px/1 -apple-system, system-ui, sans-serif; padding: 12px 20px; border-radius: 14px; background: #fff; color: #172026; border: 2px solid #d3e2dc; box-shadow: 0 8px 20px rgba(0,0,0,.25); opacity: 0; white-space: nowrap; }
  .b.lg { font-size: 46px; padding: 18px 28px; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div><div class="bg-grid"></div>
  <div id="cam">
    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <div class="layer" id="page"><img src="assets/before.png"></div>
        <div class="layer" id="panel"><img src="assets/panel.png"></div>
      </div>
    </div>
  </div>
  <div class="dim"></div>

  <div class="sticker" id="hook" style="top:300px">Medlem i fagforening? 🤝<br><span class="hl">Rabatter</span> du ikke vet om 👀</div>
  <div class="chip" id="chip" style="top:520px"><img src="../../../../site/logo.png">Cashback Norge</div>

  <div class="wall" id="wall"><h3>🤝 Medlemskap som gir rabatt</h3></div>

  <div class="captions"></div>

  <div class="endcard" id="end">
    <img class="logo" src="../../../../site/logo.png">
    <div class="url">cashback<b>norge</b>.no</div>
    <div class="tag" id="free">Gratis · ingen innlogging ✅</div>
    <div class="pills">
      <div class="pill" id="p1">🤝 Fagforeninger og medlemskap</div>
      <div class="pill" id="p2">🧩 Chrome · 📱 iPhone/iPad</div>
      <div class="pill cta" id="p3">👆 Lenke i bio</div>
    </div>
  </div>
</div>
