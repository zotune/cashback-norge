<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../shared/reel.css">
<style>
  #panel { will-change: transform; }
  .screen .layer.st { opacity: 0; }
  .chip { position: absolute; left: 50%; z-index: 62; background: var(--green); color: #fff; font-weight: 900; font-size: 46px; padding: 16px 34px; border-radius: 999px; box-shadow: 0 14px 40px rgba(0,0,0,.4); white-space: nowrap; display: flex; align-items: center; gap: 14px; }
  .chip img { width: 58px; height: 58px; }
  .search { position: absolute; left: 50%; top: 580px; z-index: 61; background: #fff; color: #202124; border-radius: 999px; padding: 22px 44px; font: 600 48px/1 -apple-system, system-ui, sans-serif; box-shadow: 0 12px 40px rgba(0,0,0,.35); white-space: nowrap; }
  .search .strike { position: absolute; left: 30px; right: 30px; top: 50%; height: 10px; margin-top: -5px; background: var(--red); border-radius: 6px; transform-origin: 0 50%; transform: scaleX(0); }
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div><div class="bg-grid"></div>
  <div id="cam">
    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <div class="layer" id="page"><img src="assets/before.png"></div>
        <div class="layer" id="panel"><img src="assets/panel.png"></div>
        <div class="layer st" id="after"><img src="assets/after.png"></div>
        <div class="layer st" id="copied"><img src="assets/copied.png"></div>
        <div class="layer st" id="s1"><img src="assets/sum1.png"></div>
        <div class="layer st" id="s2"><img src="assets/sum2.png"></div>
        <div class="layer st" id="s3"><img src="assets/sum3.png"></div>
        <div class="layer st" id="s4"><img src="assets/sum4.png"></div>
      </div>
    </div>
  </div>
  <div class="dim"></div>

  <div class="sticker" id="hook" style="top:300px">Slutt å google<br><span class="hl">rabattkode</span> 🙄</div>
  <div class="search" id="search">🔍 lyko rabattkode<div class="strike"></div></div>
  <div class="chip" id="chip" style="top:520px"><img src="../../../../site/logo.png">Cashback Norge</div>

  <div class="captions"></div>

  <div class="endcard" id="end">
    <img class="logo" src="../../../../site/logo.png">
    <div class="url">cashback<b>norge</b>.no</div>
    <div class="tag" id="free">Gratis · ingen innlogging ✅</div>
    <div class="pills">
      <div class="pill" id="p1">🧩 Chrome-utvidelse (PC/Mac)</div>
      <div class="pill" id="p2">📱 Safari på iPhone/iPad</div>
      <div class="pill cta" id="p3">👆 Lenke i bio</div>
    </div>
  </div>
</div>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../shared/reel.js"></script>
<script src="scene.js"></script>
</body>
</html>
