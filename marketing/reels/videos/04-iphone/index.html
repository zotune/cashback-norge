<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../shared/reel.css">
<style>
  .screen .layer.st { opacity: 0; }
  .label { position: absolute; left: 50%; top: 300px; z-index: 62; background: #fff; color: var(--ink); font-weight: 900; font-size: 60px; padding: 18px 40px; border-radius: 28px; box-shadow: 0 14px 40px rgba(0,0,0,.4); white-space: nowrap; opacity: 0; }
  .flash { position: absolute; inset: 0; background: #fff; z-index: 55; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div><div class="bg-grid"></div>
  <div id="cam">
    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <div class="layer" id="elk"><img src="assets/before.png"></div>
        <div class="layer" id="elkpanel"><img src="assets/panel.png"></div>
        <div class="layer st" id="lyko"><img src="assets/lyko.png"></div>
        <div class="layer st" id="lykosum"><img src="assets/lykosum.png"></div>
        <div class="layer st" id="site0"><img src="assets/site0.png"></div>
        <div class="layer st" id="site1"><img src="assets/site1.png"></div>
      </div>
    </div>
  </div>
  <div class="flash"></div>
  <div class="dim"></div>

  <div class="sticker" id="hook" style="top:300px">Har du denne<br>på <span class="hl">iPhonen</span>? 📱👀</div>
  <div class="label" id="l1">📉 Billigere pris</div>
  <div class="label" id="l2">🏷️ Rabattkoder</div>
  <div class="label" id="l3">💰 Cashback</div>
  <div class="label" id="l4">🛍️ 1700+ butikker</div>
  <div class="label" id="l5">⏱️ Oppsett: 2 min</div>

  <div class="captions"></div>

  <div class="endcard" id="end">
    <img class="logo" src="../../../../site/logo.png">
    <div class="url">cashback<b>norge</b>.no</div>
    <div class="tag" id="free">Gratis · ingen innlogging ✅</div>
    <div class="pills">
      <div class="pill" id="p1">📱 Trykk «iPhone/iPad» på siden</div>
      <div class="pill" id="p2">🧭 Fungerer i Safari</div>
      <div class="pill cta" id="p3">👆 Lenke i bio</div>
    </div>
  </div>
</div>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../shared/reel.js"></script>
<script src="scene.js"></script>
</body>
</html>
