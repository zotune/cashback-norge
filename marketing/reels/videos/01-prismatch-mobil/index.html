<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../shared/reel.css">
<style>
  #panel { will-change: transform; }
  .chip { position: absolute; left: 50%; z-index: 62; background: var(--green); color: #fff; font-weight: 900; font-size: 46px; padding: 16px 34px; border-radius: 999px; box-shadow: 0 14px 40px rgba(0,0,0,.4); white-space: nowrap; display: flex; align-items: center; gap: 14px; }
  .chip img { width: 58px; height: 58px; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div><div class="bg-grid"></div>
  <div id="cam">
    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <div class="layer" id="page"><img src="assets/before.png"></div>
        <div class="layer" id="panel"><img src="assets/panel.png"></div>
      </div>
    </div>
  </div>
  <div class="dim"></div>

  <div class="sticker" id="hook" style="top:300px">Samme mobil 📱<br><span class="hl">4 300 kr</span> billigere? 👀</div>
  <div class="chip" id="chip" style="top:560px"><img src="../../../../site/favicon.png">Cashback Norge</div>

  <div class="card" id="card" style="top:330px">
    <div class="row bad"><span class="lbl">Elkjøp</span><span class="val">13 490 kr</span></div>
    <div class="row good"><span class="lbl">Prismatch</span><span class="val">9 190 kr</span></div>
    <hr>
    <div class="total">−<span id="saved">4 300</span> kr 💸</div>
    <div class="fine">Galaxy S26 12/256 GB · priser 6. okt. 2026 · kan endres</div>
  </div>

  <div class="captions"></div>

  <div class="endcard" id="end">
    <img class="logo" src="../../../../site/favicon.png">
    <div class="url">cashback<b>norge</b>.no</div>
    <div class="tag" id="free">Gratis · ingen innlogging ✅</div>
    <div class="pills">
      <div class="pill" id="p1">🧩 Chrome-utvidelse (PC/Mac)</div>
      <div class="pill" id="p2">📱 Safari på iPhone/iPad</div>
      <div class="pill cta" id="p3">👆 Lenke i bio</div>
    </div>
  </div>
</div>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../shared/reel.js"></script>
<script src="scene.js"></script>
</body>
</html>
