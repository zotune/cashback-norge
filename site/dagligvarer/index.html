<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dagligvarer · Cashback Norge</title>
<script src="/theme.js?v=6"></script>
<link rel="stylesheet" href="/site.css?v=8">
<link rel="stylesheet" href="/offer-list.css?v=8">
<meta name="description" content="Ukens tilbud fra kundeavisene til REMA 1000, KIWI, MENY, Coop, SPAR, Joker, Bunnpris og flere – søk, sorter på rabatt og sammenlign på tvers av butikkene.">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=quokka-1">
<link rel="icon" type="image/png" href="/favicon.png?v=quokka-1">
<style>
.intro-logo { width: 96px; height: 96px; display: block; margin: 0 auto 8px; }
</style>
<script data-goatcounter="https://cashbacknorge.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="container">
  <nav class="site-tabs" aria-label="Velg seksjon"><a href="/">Cashback</a><a href="/dagens-tilbud/">Tilbud</a><a href="/dagligvarer/" aria-current="page">Dagligvarer</a></nav>
  <img class="intro-logo" src="/quokka-dagligvarer-v1.webp" alt="">
  <h1>Dagligvarer</h1>
  <p class="subtitle">Ukens tilbud fra kundeavisene – søk og sorter på tvers av butikkene.</p>
  <div class="update-row"><span id="updated">Oppdatert daglig</span><span data-theme-control></span></div>
  <aside class="cbn-card invite-card" id="support-invite" aria-labelledby="support-invite-title" hidden>
    <div class="invite-card-header">
      <span class="cbn-chip cbn-chip--muted">Annonse</span>
      <span data-invite-provider></span>
      <button class="cbn-button cbn-button--quiet invite-card-dismiss" type="button" aria-label="Skjul annonsen"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <h2 id="support-invite-title" data-invite-title></h2>
    <p data-invite-description></p>
    <a class="cbn-button cbn-button--primary invite-card-action" target="_blank" rel="sponsored noopener noreferrer"><span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a>
    <p class="invite-card-fine-print" data-invite-fine-print hidden></p>
  </aside>
  <div id="offer-list"></div>
  <p class="note" id="note"></p>
  <footer class="footer" style="margin-bottom:56px;">
    <nav style="margin-bottom:6px;">
      <a href="/om-oss/">Om oss</a> · <a href="/informasjonskapsler/">Informasjonskapsler</a>
    </nav>
    <div>© 2026 Cashback Norge · Uavhengig oversikt, ikke tilknyttet butikkene</div>
  </footer>
</div>
<div class="fixed-footer">
  <div class="tip-line"></div>
</div>
<script src="/shared-data.js?v=8"></script>
<script src="/offer-list.js?v=8"></script>
<script>
// Data: /grocery-offers.json, built by the daily crawl from the supermarkets' flyers (Tjek's
// offer data). Votes use the same Supabase functions as the discount codes, key "dagligvarer".
const {
  getGroceryChain, getGroceryOfferLink, getGrocerySearchQuery, installGroceryChainStyles,
  getGroceryUnitPrice, getGroceryCardBonus, GROCERY_CARD_BONUSES, PREMIUM_CARDS, getFreeCards, getCardBenefitOffers, watchCardBenefitDate, renderBonusCardGroup,
} = window.SHARED;
// Flyer headings are often in capitals ("MILLS KAVIAR TUBE").
function formatHeading(heading) {
  return heading === heading.toUpperCase() ? heading.toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (m, s, l) => s + l.toUpperCase()) : heading;
}
function formatDescription(description) {
  return description.split(/\n+/).map((line) => line.trim()).filter(Boolean).join(" · ").replace(/\/(KG|L|STK)\b/g, (m, unit) => `/${unit.toLowerCase()}`);
}
const chainLabel = (name) => getGroceryChain(name)?.label ?? name;

function toItem(offer) {
  const title = formatHeading(offer.heading);
  const chain = getGroceryChain(offer.chain);
  const card = getGroceryCardBonus(offer.chain);
  const unit = getGroceryUnitPrice(offer.description || "");
  return {
    id: offer.id, title,
    description: offer.description ? formatDescription(offer.description) : "",
    group: offer.chain,
    store: { label: chainLabel(offer.chain), className: chain ? `badge-chain-${chain.slug}` : "cbn-chip--muted" },
    amount: offer.amount,
    ...(offer.prePrice > offer.amount ? { prePrice: offer.prePrice, saving: Math.round((1 - offer.amount / offer.prePrice) * 100) } : {}),
    ...(offer.imageUrl?.startsWith("/offer-images/") ? { imageUrl: offer.imageUrl } : {}),
    validFrom: offer.validFrom, validTo: offer.validTo,
    link: getGroceryOfferLink(offer.chain, getGrocerySearchQuery(title) || title),
    ...(unit ? { unit } : {}),
    ...(card ? { bonus: { label: card.label.replace(/ Kredittkort| Mastercard/, "-kort"), rate: card.rate, url: card.url, title: card.tip.replace(/^# /, "") } } : {}),
  };
}

let cardBenefitOffers = [];
let bonusPanel;
function renderCardBonuses() {
  if (!bonusPanel) return;
  const groceries = GROCERY_CARD_BONUSES.map((card) => ({
    label: card.label, badge: card.id, pct: 0, rewardLabel: card.rate, url: card.url, approx: false, tip: card.tip,
  }));
  bonusPanel.innerHTML = `<div class="chip-group"><span class="chip-group-label">Dagligvarekort</span><div class="chip-group-items" data-cards="grocery"></div></div>
    <div class="chip-group"><span class="chip-group-label">Gratis</span><div class="chip-group-items" data-cards="free"></div></div>
    <div class="chip-group"><span class="chip-group-label">Premium</span><div class="chip-group-items" data-cards="premium"></div></div>`;
  renderBonusCardGroup(groceries, bonusPanel.querySelector('[data-cards="grocery"]'));
  renderBonusCardGroup(getFreeCards(cardBenefitOffers), bonusPanel.querySelector('[data-cards="free"]'));
  renderBonusCardGroup(PREMIUM_CARDS, bonusPanel.querySelector('[data-cards="premium"]'));
  window.CashbackTooltips.attach(bonusPanel);
}
// Same "Ekstra cashback" as the front page: a toggle by the count, the cards under the search.
function fillCardBonuses(panel) {
  bonusPanel = panel;
  renderCardBonuses();
  watchCardBenefitDate(renderCardBonuses);
  // Instabank uses the same current benefits and affiliate URL as the home page.
  fetch("/cashback-index.json", { cache: "no-cache", signal: AbortSignal.timeout(10000) })
    .then((response) => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); })
    .then((index) => { cardBenefitOffers = getCardBenefitOffers(Array.isArray(index.offers) ? index.offers : []); renderCardBonuses(); })
    .catch(() => { /* Static cards remain usable when the daily index is unavailable. */ });
}

installGroceryChainStyles();
createOfferList({
  mount: document.getElementById("offer-list"),
  dataUrl: "/grocery-offers.json",
  storageKey: "cbn-dagligvarer-v1",
  voteKey: "dagligvarer",
  groupLabel: "Butikker",
  noGroupsText: "Velg minst én butikk.",
  searchPlaceholder: "Søk etter vare, f.eks. kaffe...",
  features: { unit: true, validity: true, bonus: true },
  extraCashback: fillCardBonuses,
  groupName: chainLabel,
  groupClass: (name) => { const chain = getGroceryChain(name); return chain ? `badge-chain-${chain.slug}` : ""; },
  dropUrlParams: ["kjede"],
  // An old link to one chain (?kjede=KIWI) shows only that chain.
  onlyGroupsFromUrl: (params, groups) => groups.includes(params.get("kjede")) ? [params.get("kjede")] : undefined,
  read: (catalog) => ({
    items: (Array.isArray(catalog.offers) ? catalog.offers : []).filter((offer) => typeof offer.amount === "number").map(toItem),
    updated: catalog.generatedAt,
    note: `Priser fra kundeavisene for ${catalog.location || "Oslo"}-området, oppdatert daglig. Tilbud kan variere mellom regioner og butikker og gjelder så langt lageret rekker. Stemmene er brukernes egne vurderinger.`,
  }),
});
</script>
</body>
</html>
