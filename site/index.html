<body>
<div class="container">
  <img src="icon.png" alt="" style="width:48px;height:48px;border-radius:12px;display:block;margin:0 auto 8px;">
  <h1>Cashback Norge</h1>
  <p class="subtitle">Finn cashback-tilbud for norske nettbutikker</p>
  <p class="subtitle">Oppdatert daglig · <a href="https://chromewebstore.google.com/detail/jlephlinnjimkglbodkelonjohanlbmh" target="_blank">Chrome-extension</a> · <a href="https://github.com/zotune/cashback-norge" target="_blank">GitHub</a></p>
  <div class="adblock-warning">⚠ Adblock er aktivert – husk å deaktivere det på butikkens side for å sikre cashback-sporing</div>
  <div class="search-wrap">
    <input class="search" type="search" placeholder="Søk etter butikk eller nettside..." autofocus>
    <input class="global-sum" type="text" inputmode="decimal" placeholder="Kjøpesum">
  </div>
  <div class="tip-line"></div>
  <div class="bonus-section">
    <button class="bonus-toggle" type="button">
      <span class="bonus-toggle-arrow">▶</span> Ekstra cashback
    </button>
    <div class="bonus-chips" style="display:none">
      <div class="chip-group">
        <span class="chip-group-label">Gratis</span>
        <div class="chip-group-items" id="free-chips"></div>
      </div>
      <div class="chip-group">
        <span class="chip-group-label">Premium</span>
        <div class="chip-group-items" id="premium-chips"></div>
      </div>
    </div>
  </div>
  <div class="count"></div>
  <div class="results"></div>
</div>
<script src="shared-data.js"></script>
<script>
const { PROVIDER_NAMES, PROVIDER_TIPS, EB_PER_TRUMF_KR, FREE_CARDS, PREMIUM_CARDS, SUPPORT_LINKS, MERCHANT_ALIASES } = window.SHARED;

let allMerchants = [];

let currentAmount = 0;

async function init() {
  renderTips();
  setupBonusToggle();
  const res = await fetch("cashback-index.json");
  const data = await res.json();
  allMerchants = groupByMerchant(data.offers);
  render("");
  document.querySelector(".search").addEventListener("input", (e) => {
    render(e.target.value);
  });
  document.querySelector(".global-sum").addEventListener("input", (e) => {
    const raw = e.target.value.replace(/[^0-9.,]/g, "").replace(",", ".");
    currentAmount = raw.length > 0 ? parseFloat(raw) : 0;
    render(document.querySelector(".search").value);
    renderBonusChips();
  });
}

function getMaxPct(o) {
  const r = o.reward.trim();
  const range = r.match(/^([\d.,]+)-([\d.,]+)\s*%$/);
  if (range) return parseFloat(range[2].replace(",", "."));
  const pct = r.match(/([\d.,]+)\s*%/);
  if (pct) return parseFloat(pct[1].replace(",", "."));
  const sas = r.match(/^([\d\s]+)\s*poeng\s+per\s+100\s*kr$/i);
  if (sas) return parseInt(sas[1].replace(/\s/g, ""), 10) / EB_PER_TRUMF_KR;
  const kr = r.match(/([\d.,]+)\s*kr/i);
  if (kr) return parseFloat(kr[1].replace(",", ".")) / 1000;
  return 0;
}

function normalizeName(name) {
  let n = name
    .replace(/\s*Direct Deals$/i, "")
    .replace(/\.com$/i, "")
    .replace(/\.no$/i, "")
    .replace(/\.se$/i, "")
    .replace(/\.eu$/i, "")
    .trim();
  const key = n.toLowerCase();
  if (MERCHANT_ALIASES[key]) {
    return MERCHANT_ALIASES[key];
  }
  return n;
}

function groupByMerchant(offers) {
  // Domains that are aliases for another domain (treated as the same merchant)
  const DOMAIN_ALIASES = {
    "bestdrive.no": "dekkmann.no",
    "dekkhotell.no": "dekkmann.no",
  };

  // Normalize domains through aliases before grouping
  function canonicalDomain(d) {
    return DOMAIN_ALIASES[d] || d;
  }

  // Tracking domains that should be excluded from grouping (shared by many unrelated merchants)
  const domainCount = {};
  for (const o of offers) {
    for (const d of (o.domains || [])) {
      domainCount[d] = (domainCount[d] || 0) + 1;
    }
  }
  const sharedDomains = new Set(Object.keys(domainCount).filter(d =>
    domainCount[d] > 8 || d.includes("sjv.io") || d.includes("emjcd.com") || d.includes("jdoqocy.com") || d.includes("dpbolvw.net")
  ));

  // Union-find: group offers that share a domain
  const domainToGroup = new Map();
  const groups = [];

  for (const o of offers) {
    if (!o.reward || !o.reward.trim()) continue;
    if (o.provider === "curve") continue;

    const usableDomains = (o.domains || []).map(canonicalDomain).filter(d => !sharedDomains.has(d));
    let group = null;

    // Find existing group via domain overlap
    for (const d of usableDomains) {
      if (domainToGroup.has(d)) {
        group = domainToGroup.get(d);
        break;
      }
    }
    // Also try by normalized name
    const name = normalizeName(o.merchantName);
    const nameKey = name.toLowerCase().replace(/[^a-z0-9]/g, "");
    if (!group && domainToGroup.has("name:" + nameKey)) {
      group = domainToGroup.get("name:" + nameKey);
    }

    if (!group) {
      group = { name, domains: [], offers: [] };
      groups.push(group);
    }

    // Prefer a nicely capitalized name (not all-caps, not all-lower)
    const current = group.name;
    if (current === current.toLowerCase() || current === current.toUpperCase()) {
      if (name !== name.toLowerCase() && name !== name.toUpperCase()) {
        group.name = name;
      }
    }

    for (const d of (o.domains || [])) {
      if (!group.domains.includes(d)) group.domains.push(d);
    }
    group.offers.push(o);

    // Register all usable domains and name to point to this group
    for (const d of usableDomains) {
      domainToGroup.set(d, group);
    }
    domainToGroup.set("name:" + nameKey, group);
  }

  for (const m of groups) {
    // Deduplicate: keep only the best offer per provider (highest reward wins)
    m.offers.sort((a, b) => getMaxPct(b) - getMaxPct(a));
    const bestPerProvider = new Map();
    m.offers = m.offers.filter(o => {
      const key = o.provider + ":" + (o.discountCode || "");
      if (bestPerProvider.has(key)) return false;
      bestPerProvider.set(key, true);
      return true;
    });
    // Override group name based on primary domain when merchant names are generic
    const DOMAIN_DISPLAY_NAMES = {
      "gjensidige.no": "Gjensidige",
      "if.no": "If Forsikring",
      "tryg.no": "Tryg",
      "fremtind.no": "Fremtind",
      "dekkmann.no": "Bestdrive",
    };
    const primaryDomain = m.domains[0];
    if (primaryDomain && DOMAIN_DISPLAY_NAMES[primaryDomain]) {
      m.name = DOMAIN_DISPLAY_NAMES[primaryDomain];
    }
  }
  return groups.sort((a, b) => a.name.localeCompare(b.name, "nb"));
}

const TRACKING_DOMAINS = ["sjv.io", "pxf.io", "emjcd.com", "jdoqocy.com", "dpbolvw.net", "anrdoezrs.net", "tkqlhce.com", "kqzyfj.com", "awstrack.me", "madmetrics.com", "synxis.com", "vpweb.no"];

function pickBestDomain(domains) {
  if (!domains || domains.length === 0) return "";
  const CC_SUBS = new Set(["no", "se", "dk", "fi", "de", "fr", "es", "it", "nl", "uk", "us", "eu", "nor"]);
  const clean = domains.filter(d => {
    if (TRACKING_DOMAINS.some(t => d.includes(t))) return false;
    // Filter out obviously broken domains
    if (d.includes(".com.com") || d.includes(".no.se") || d.includes(".no.no")) return false;
    return true;
  });
  if (clean.length === 0) return "";
  // Strip country-code subdomains to get base domain variants
  const withBase = [...clean];
  for (const d of clean) {
    const parts = d.split(".");
    if (parts.length >= 3 && CC_SUBS.has(parts[0])) {
      const base = parts.slice(1).join(".");
      if (!withBase.includes(base)) withBase.push(base);
    }
  }
  // Prefer .no, then .com, then shortest domain (prefer shorter/base domains over CC subdomain variants)
  const byLen = withBase.slice().sort((a, b) => a.length - b.length);
  const no = byLen.find(d => d.endsWith(".no") || d.includes(".no/"));
  if (no) return no;
  const com = byLen.find(d => d.endsWith(".com") || d.includes(".com/"));
  if (com) return com;
  return byLen[0];
}

function render(query) {
  const q = query.trim().toLowerCase();
  const filtered = q.length === 0
    ? allMerchants
    : allMerchants.filter(m =>
        m.name.toLowerCase().includes(q) ||
        m.domains.some(d => d.includes(q))
      );

  const countEl = document.querySelector(".count");
  countEl.textContent = q.length > 0
    ? `${filtered.length} av ${allMerchants.length} butikker`
    : `${allMerchants.length} butikker`;

  const container = document.querySelector(".results");
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">Ingen treff</div>';
    return;
  }

  container.innerHTML = filtered.map(m => {
    const key = m.name.toLowerCase();
    const domain = pickBestDomain(m.domains);
    const hasIcon = domain.length > 0;
    const letter = esc(m.name.charAt(0).toUpperCase());
    const iconHtml = hasIcon
      ? `<img class="merchant-icon" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64" alt="" loading="lazy" onload="if(this.naturalWidth<20){this.style.display='none';this.nextElementSibling.style.display='flex'}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="merchant-icon merchant-icon-fallback" style="display:none">${letter}</span>`
      : `<span class="merchant-icon merchant-icon-fallback">${letter}</span>`;
    const cashbackOffers = m.offers.filter(o => o.provider !== "rabattkode" && o.provider !== "dnb");
    const codeOffers = m.offers.filter(o => (o.provider === "rabattkode" || o.provider === "dnb") && o.discountCode);
    const offerHtml = cashbackOffers.map(o => {
      const url = o.provider === "trumf" || o.provider === "klarna" ? o.sourceUrl : o.activationUrl;
      const label = currentAmount > 0 ? calcReward(o, currentAmount) : formatCompactReward(o);
      const fullReward = formatReward(o);
      const compact = formatCompactReward(o);
      const terms = o.terms || "";
      const hasBreakdown = terms.includes("\n") && /\d+.*%/.test(terms);
      const rewardDetail = (compact !== fullReward) ? fullReward : "";
      const tipBase = hasBreakdown
        ? (currentAmount > 0 ? formatBreakdownWithAmounts(terms, currentAmount) : terms)
        : (PROVIDER_TIPS[o.provider] || "");
      const tipText = [rewardDetail, tipBase].filter(Boolean).join("\n\n");
      const tooltipHtml = tipText ? `<span class="offer-tooltip">${esc(tipText)}</span>` : "";
      return `<span class="offer-wrap">${tooltipHtml}<a class="offer" href="${esc(url)}" target="_blank" rel="noreferrer">
        <span class="offer-reward">${esc(label)}</span>
        <span class="badge badge-${o.provider}">${esc(PROVIDER_NAMES[o.provider] || o.provider)}</span>
      </a></span>`;
    }).join("");
    const codesHtml = codeOffers.map(o => {
      const code = o.discountCode || "";
      return `<div class="code-item">
        <span class="code-reward">${esc(o.reward)}</span>
        <span class="code-value">${esc(code)}</span>
        <button class="code-copy-btn" type="button" data-code="${esc(code)}"><span class="copy-tooltip">Kopier: ${esc(code)}</span><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </div>`;
    }).join("");
    const storeUrl = domain ? `https://${domain}` : "";
    const nameHtml = storeUrl
      ? `<a class="merchant-name" href="${esc(storeUrl)}" target="_blank" rel="noreferrer">${esc(m.name)}</a>`
      : `<span class="merchant-name">${esc(m.name)}</span>`;
    return `<div class="merchant">
      <div class="merchant-header">
        ${iconHtml}
        ${nameHtml}
      </div>
      <div class="offers">${offerHtml}</div>
      ${codesHtml ? `<div class="codes-inline"><button class="codes-toggle" type="button"><span class="codes-toggle-arrow">&#9654;</span> Rabattkoder (${codeOffers.length})</button><div class="codes-items">${codesHtml}</div></div>` : ""}
    </div>`;
  }).join("");

  // Attach codes toggle handlers
  container.querySelectorAll(".codes-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const section = btn.closest(".codes-inline");
      section.classList.toggle("open");
      btn.classList.toggle("open");
    });
  });

  // Attach copy handlers
  container.querySelectorAll(".code-copy-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const origSvg = btn.querySelector('svg').outerHTML;
      const tooltip = btn.querySelector('.copy-tooltip');
      navigator.clipboard.writeText(btn.dataset.code).then(() => {
        btn.querySelector('svg').outerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        if (tooltip) { tooltip.textContent = "Kopiert!"; tooltip.classList.add("visible"); }
        setTimeout(() => {
          btn.querySelector('svg').outerHTML = origSvg;
          if (tooltip) { tooltip.textContent = `Kopier: ${btn.dataset.code}`; tooltip.classList.remove("visible"); }
        }, 1500);
      });
    });
  });
}

function formatCompactReward(o) {
  const full = formatReward(o);
  const pct = full.match(/(~)?(\d+(?:[,.]\d+)?\s*[-–]\s*\d+(?:[,.]\d+)?\s*%|\d+(?:[,.]\d+)?\s*%)/i);
  if (pct) return ((pct[1] || "") + pct[2]).replace(/\s+/g, " ");
  const kr = full.match(/\d+(?:[,.]\d+)?\s*kr/i);
  if (kr) return kr[0].replace(/\s+/g, " ");
  if (/gratis\s+frakt/i.test(full)) return "Gratis frakt";
  if (/gratis/i.test(full)) return "Gratis";
  return full.length <= 20 ? full : full;
}
function formatReward(o) {
  const r = o.reward.trim();
  if (o.provider === "sas") {
    const rate = r.match(/^([\d\s]+)\s*poeng\s+per\s+100\s*kr$/i);
    if (rate) {
      const p = parseInt(rate[1].replace(/\s/g, ""), 10);
      return `~${(p / EB_PER_TRUMF_KR).toFixed(1).replace(".", ",")} % (~${p} EB/100kr)`;
    }
    const fixed = r.match(/^([\d\s]+)\s*poeng$/i);
    if (fixed) {
      const p = parseInt(fixed[1].replace(/\s/g, ""), 10);
      return `~${Math.round(p / EB_PER_TRUMF_KR)} kr (~${p.toLocaleString("nb-NO")} EB)`;
    }
  }
  if (o.provider === "trumf") {
    const range = r.match(/^([\d,]+)-([\d,]+)\s*%$/);
    if (range) {
      const min = parseFloat(range[1].replace(",", "."));
      const max = parseFloat(range[2].replace(",", "."));
      return `${r} (~${Math.round(min * EB_PER_TRUMF_KR)}-${Math.round(max * EB_PER_TRUMF_KR)} EB/100kr)`;
    }
    const pct = r.match(/^([\d,]+)\s*%$/);
    if (pct) {
      const p = parseFloat(pct[1].replace(",", "."));
      return `${r} (~${Math.round(p * EB_PER_TRUMF_KR)} EB/100kr)`;
    }
  }
  return r;
}

function formatKr(n) {
  return n.toFixed(2).replace(".", ",").replace(/,00$/, "");
}

function formatBreakdownWithAmounts(terms, amount) {
  return terms.split("\n").map(line => {
    const m = line.match(/^([\d,]+)\s*%/);
    if (m) {
      const pct = parseFloat(m[1].replace(",", "."));
      const kr = amount * pct / 100;
      return `${line} (${formatKr(kr)} kr)`;
    }
    return line;
  }).join("\n");
}

function calcReward(o, amount) {
  const r = o.reward.trim();
  const fmt = (n) => n.toFixed(2).replace(".", ",").replace(/,00$/, "");
  // range percent
  const range = r.match(/^([\d,]+)-([\d,]+)\s*%$/);
  if (range) {
    const min = parseFloat(range[1].replace(",", "."));
    const max = parseFloat(range[2].replace(",", "."));
    const minKr = amount * min / 100;
    const maxKr = amount * max / 100;
    if (o.provider === "trumf") {
      const minEb = Math.round(amount * min * EB_PER_TRUMF_KR / 100);
      const maxEb = Math.round(amount * max * EB_PER_TRUMF_KR / 100);
      return `${fmt(minKr)}-${fmt(maxKr)} kr (~${minEb}-${maxEb} EB)`;
    }
    return `${fmt(minKr)}-${fmt(maxKr)} kr`;
  }
  // single percent
  const pct = r.match(/^([\d,]+)\s*%$/);
  if (pct) {
    const p = parseFloat(pct[1].replace(",", "."));
    const kr = amount * p / 100;
    if (o.provider === "trumf") {
      const eb = Math.round(amount * p * EB_PER_TRUMF_KR / 100);
      return `${fmt(kr)} kr (~${eb} EB)`;
    }
    return `${fmt(kr)} kr`;
  }
  // SAS rate
  const sas = r.match(/^([\d\s]+)\s*poeng\s+per\s+100\s*kr$/i);
  if (sas) {
    const pts = parseInt(sas[1].replace(/\s/g, ""), 10);
    const eb = Math.round(amount * pts / 100);
    const kr = eb / EB_PER_TRUMF_KR;
    return `~${fmt(kr)} kr (~${eb} EB)`;
  }
  // SAS fixed
  const sasFixed = r.match(/^([\d\s]+)\s*poeng$/i);
  if (sasFixed) {
    const pts = parseInt(sasFixed[1].replace(/\s/g, ""), 10);
    return `~${Math.round(pts / EB_PER_TRUMF_KR)} kr (~${pts.toLocaleString("nb-NO")} EB)`;
  }
  return r;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function renderTips() {
  const pick = SUPPORT_LINKS[Math.floor(Math.random() * SUPPORT_LINKS.length)];
  const container = document.querySelector(".tip-line");
  if (pick) {
    container.innerHTML = `<a href="${esc(pick.url)}" target="_blank" rel="noreferrer">${esc(pick.text)}</a>`;
  }
}

function renderChipGroup(cards, container) {
  container.innerHTML = cards.map(c => {
    const amt = currentAmount > 0 ? currentAmount : 0;
    let rewardText;
    if (amt > 0) {
      const kr = Math.round(amt * c.pct);
      rewardText = c.approx ? `+~${kr} kr` : `+${kr} kr`;
    } else {
      const pctStr = (c.pct * 100).toFixed(2).replace(".", ",").replace(/0$/, "");
      rewardText = c.approx ? `+~${pctStr}%` : `+${pctStr}%`;
    }
    return `<span class="tooltip-wrap">
      <span class="tooltip">${esc(c.tip)}</span>
      <a class="bonus-chip" href="${esc(c.url)}" target="_blank" rel="noreferrer">
        ${rewardText} <span class="badge badge-${c.badge}">${esc(c.label)}</span>
      </a>
    </span>`;
  }).join("");
}

function renderBonusChips() {
  renderChipGroup(FREE_CARDS, document.getElementById("free-chips"));
  renderChipGroup(PREMIUM_CARDS, document.getElementById("premium-chips"));
}

function setupBonusToggle() {
  const btn = document.querySelector(".bonus-toggle");
  const chips = document.querySelector(".bonus-chips");
  renderBonusChips();
  const savedOpen = localStorage.getItem("cashback-bonus-open") === "1";
  if (savedOpen) {
    chips.style.display = "flex";
    btn.classList.add("open");
  }
  btn.addEventListener("click", () => {
    const open = chips.style.display !== "none";
    chips.style.display = open ? "none" : "flex";
    btn.classList.toggle("open", !open);
    localStorage.setItem("cashback-bonus-open", open ? "0" : "1");
  });

  // Tap-to-show tooltips on mobile (bonus chips only)
  document.addEventListener("click", (e) => {
    const wrap = e.target.closest(".tooltip-wrap");
    document.querySelectorAll(".tooltip-wrap.active").forEach(el => {
      if (el !== wrap) el.classList.remove("active");
    });
    if (wrap) {
      wrap.classList.toggle("active");
    }
  });
}

init();

async function checkAdblock() {
  const [urlBlocked, domBlocked] = await Promise.all([
    checkAdblockByUrl(),
    checkAdblockByDom(),
  ]);
  if (urlBlocked || domBlocked) {
    document.querySelector(".adblock-warning").classList.add("visible");
  }
}

async function checkAdblockByUrl() {
  if (document.querySelector('meta[http-equiv="Content-Security-Policy"]') !== null) return false;
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 2500);
    await fetch("https://widgets.outbrain.com/outbrain.js", { mode: "no-cors", signal: controller.signal });
    clearTimeout(timeoutId);
    return false;
  } catch { return true; }
}

async function checkAdblockByDom() {
  try {
    const container = document.createElement("div");
    container.style.cssText = "position:absolute;left:-9999px;top:-9999px;";
    for (const id of ["AdHeader", "AdContainer", "AD_Top", "homead", "ad-lead"]) {
      const el = document.createElement("div");
      el.id = id;
      el.style.cssText = "display:block;width:1px;height:1px;";
      container.appendChild(el);
    }
    document.body.appendChild(container);
    await new Promise(r => setTimeout(r, 100));
    let blockedCount = 0;
    for (const id of ["AdHeader", "AdContainer", "AD_Top", "homead", "ad-lead"]) {
      const el = container.querySelector("#" + id);
      if (!el || el.offsetHeight === 0) blockedCount++;
    }
    container.remove();
    return blockedCount >= 1;
  } catch { return false; }
}

checkAdblock();
