<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cashback Norge</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f7faf8;
  color: #172026;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
h1 { font-size: 22px; text-align: center; margin-bottom: 4px; }
.subtitle { color: #5d6b71; font-size: 13px; text-align: center; margin-bottom: 20px; }
.search-wrap {
  display: flex;
  gap: 8px;
  position: relative;
  margin-bottom: 20px;
}
.search {
  background: #fff;
  border: 1px solid #d6e1dc;
  border-radius: 10px;
  color: #172026;
  font: inherit;
  font-size: 16px;
  height: 48px;
  outline: none;
  padding: 0 14px;
  flex: 1;
  min-width: 0;
}
.search:focus { border-color: #1f8f5f; }
.search::placeholder { color: #8a9a92; }
.global-sum {
  background: #fff;
  border: 1px solid #d6e1dc;
  border-radius: 10px;
  color: #172026;
  font: inherit;
  font-size: 16px;
  height: 48px;
  outline: none;
  padding: 0 14px;
  text-align: right;
  width: 110px;
  flex-shrink: 0;
}
.global-sum:focus { border-color: #1f8f5f; }
.global-sum::placeholder { color: #8a9a92; }
.results { display: grid; gap: 12px; }
.merchant {
  background: #fff;
  border: 1px solid #d6e1dc;
  border-radius: 10px;
}
.merchant-header {
  align-items: center;
  display: flex;
  gap: 10px;
  padding: 12px 14px;
}
.merchant-icon {
  background: #f7faf8;
  border: 1px solid #d8e3de;
  border-radius: 6px;
  height: 28px;
  object-fit: contain;
  padding: 3px;
  width: 28px;
}
.merchant-icon-fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: #1f8f5f;
}
.merchant-name {
  font-size: 15px;
  font-weight: 700;
  flex: 1;
  overflow-wrap: anywhere;
}
.offers { display: grid; gap: 6px; padding: 0 14px 12px; }
.offer {
  align-items: center;
  background: #f7faf8;
  border: 1px solid #d8e3de;
  border-radius: 6px;
  color: #172026;
  display: flex;
  gap: 8px;
  min-height: 38px;
  padding: 7px 10px;
  text-decoration: none;
}
.offer:active { background: #edf2ef; }
.offer-wrap {
  position: relative;
  display: block;
}
.offer-tooltip {
  background: #172026;
  border-radius: 8px;
  bottom: calc(100% + 6px);
  color: #fff;
  font-size: 12px;
  left: 0;
  line-height: 1.45;
  opacity: 0;
  padding: 8px 12px;
  pointer-events: none;
  position: absolute;
  transition: opacity 0.15s;
  white-space: pre-line;
  width: max-content;
  max-width: min(340px, calc(100vw - 32px));
  z-index: 10;
}
.offer-tooltip::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 20px;
  border: 5px solid transparent;
  border-top-color: #172026;
}
.offer-wrap:hover .offer-tooltip {
  opacity: 1;
  pointer-events: auto;
}
.offer-reward {
  font-size: 14px;
  font-weight: 700;
  flex: 1;
}
.badge {
  align-items: center;
  border-radius: 5px;
  display: inline-flex;
  font-size: 11px;
  font-weight: 800;
  line-height: 1;
  min-height: 22px;
  padding: 0 7px;
  white-space: nowrap;
}
.badge-trumf { background: #07006b; color: #fff; }
.badge-klarna { background: #ffa8cd; color: #0b051d; }
.badge-remember { background: #111; color: #ff9900; }
.badge-sas { background: #00005c; color: #fff; }
.badge-tfbank { background: #e30613; color: #fff; }
.badge-dnb { background: #14555a; color: #fff; }
.badge-curve { background: #000; color: #fff; }
.empty {
  color: #8a9a92;
  font-size: 14px;
  padding: 40px 0;
  text-align: center;
}
.footer {
  border-top: 1px solid #edf2ef;
  color: #8a9a92;
  font-size: 11px;
  margin-top: 32px;
  padding-top: 12px;
  text-align: center;
}
.footer a { color: #5d6b71; }
.count {
  color: #8a9a92;
  font-size: 12px;
  margin-bottom: 12px;
}
.tips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.tip {
  align-items: center;
  background: #fff;
  border: 1px solid #d6e1dc;
  border-radius: 8px;
  color: #172026;
  display: flex;
  font-size: 12px;
  font-weight: 600;
  gap: 6px;
  padding: 8px 12px;
  text-decoration: none;
  flex: 1;
  min-width: 0;
}
.tip:active { background: #f0f4f2; }
.tip-emoji { font-size: 16px; flex-shrink: 0; }
.tip-text { overflow-wrap: anywhere; }
.bonus-section {
  margin-bottom: 16px;
}
.bonus-toggle {
  align-items: center;
  appearance: none;
  background: none;
  border: none;
  color: #5d6b71;
  cursor: pointer;
  display: flex;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  gap: 6px;
  margin-bottom: 8px;
  padding: 0;
}
.bonus-toggle:hover { color: #172026; }
.bonus-toggle-arrow {
  display: inline-block;
  font-size: 10px;
  transition: transform 0.15s;
}
.bonus-toggle.open .bonus-toggle-arrow {
  transform: rotate(90deg);
}
.bonus-label {
  color: #8a9a92;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.03em;
  margin-bottom: 6px;
  text-transform: uppercase;
}
.bonus-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.chip-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.chip-group-label {
  color: #8a9a92;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.chip-group-items {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.tooltip-wrap {
  position: relative;
}
.tooltip {
  background: #172026;
  border-radius: 8px;
  bottom: calc(100% + 6px);
  color: #fff;
  font-size: 12px;
  left: 50%;
  line-height: 1.45;
  opacity: 0;
  padding: 8px 12px;
  pointer-events: none;
  position: absolute;
  transform: translateX(-50%);
  transition: opacity 0.15s;
  white-space: pre-line;
  width: max-content;
  max-width: 260px;
  z-index: 10;
}
.tooltip::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: #172026;
}
.tooltip-wrap:hover .tooltip,
.tooltip-wrap.active .tooltip {
  opacity: 1;
  pointer-events: auto;
}
.bonus-chip {
  align-items: center;
  background: #f0f4f2;
  border: 1px solid #d8e3de;
  border-radius: 20px;
  color: #172026;
  display: inline-flex;
  font-size: 11px;
  font-weight: 600;
  gap: 4px;
  line-height: 1;
  padding: 5px 10px;
  text-decoration: none;
  white-space: nowrap;
}
.bonus-chip:active { background: #e4ebe7; }
.bonus-chip .badge { font-size: 9px; min-height: 16px; padding: 0 5px; }
.badge-sas-amex { background: #00005c; color: #fff; }
.badge-norwegian { background: #d81939; color: #fff; }
.badge-lunar { background: #2bb24c; color: #fff; }
.badge-klarna { background: #ffb3c7; color: #17120f; }
</style>
</head>
<body>
<div class="container">
  <h1>Cashback Norge</h1>
  <p class="subtitle">Finn cashback-tilbud for norske nettbutikker</p>
  <p class="subtitle">Oppdatert daglig · <a href="https://chromewebstore.google.com/detail/jlephlinnjimkglbodkelonjohanlbmh" target="_blank">Chrome-extension</a> · <a href="https://github.com/zotune/cashback-norge" target="_blank">GitHub</a></p>
  <div class="search-wrap">
    <input class="search" type="search" placeholder="Søk etter butikk eller nettside..." autofocus>
    <input class="global-sum" type="text" inputmode="decimal" placeholder="Kjøpesum">
  </div>
  <div class="tips"></div>
  <div class="bonus-section">
    <button class="bonus-toggle" type="button">
      <span class="bonus-toggle-arrow">▶</span> Ekstra cashback
    </button>
    <div class="bonus-chips" style="display:none">
      <div class="chip-group">
        <span class="chip-group-label">Gratis</span>
        <div class="chip-group-items" id="free-chips"></div>
      </div>
      <div class="chip-group">
        <span class="chip-group-label">Premium</span>
        <div class="chip-group-items" id="premium-chips"></div>
      </div>
    </div>
  </div>
  <div class="count"></div>
  <div class="results"></div>
</div>
<script src="shared-data.js"></script>
<script>
const { PROVIDER_NAMES, PROVIDER_TIPS, EB_PER_TRUMF_KR, FREE_CARDS, PREMIUM_CARDS, SUPPORT_LINKS, MERCHANT_ALIASES } = window.SHARED;

let allMerchants = [];

let currentAmount = 0;

async function init() {
  renderTips();
  setupBonusToggle();
  const res = await fetch("cashback-index.json");
  const data = await res.json();
  allMerchants = groupByMerchant(data.offers);
  render("");
  document.querySelector(".search").addEventListener("input", (e) => {
    render(e.target.value);
  });
  document.querySelector(".global-sum").addEventListener("input", (e) => {
    const raw = e.target.value.replace(/[^0-9.,]/g, "").replace(",", ".");
    currentAmount = raw.length > 0 ? parseFloat(raw) : 0;
    render(document.querySelector(".search").value);
    renderBonusChips();
  });
}

function getMaxPct(o) {
  const r = o.reward.trim();
  const range = r.match(/^([\d,]+)-([\d,]+)\s*%$/);
  if (range) return parseFloat(range[2].replace(",", "."));
  const pct = r.match(/^([\d,]+)\s*%$/);
  if (pct) return parseFloat(pct[1].replace(",", "."));
  const sas = r.match(/^([\d\s]+)\s*poeng\s+per\s+100\s*kr$/i);
  if (sas) return parseInt(sas[1].replace(/\s/g, ""), 10) / EB_PER_TRUMF_KR;
  return 0;
}

function normalizeName(name) {
  let n = name
    .replace(/\s*Direct Deals$/i, "")
    .replace(/\.com$/i, "")
    .replace(/\.no$/i, "")
    .replace(/\.se$/i, "")
    .replace(/\.eu$/i, "")
    .trim();
  const key = n.toLowerCase();
  if (MERCHANT_ALIASES[key]) {
    return MERCHANT_ALIASES[key];
  }
  return n;
}

function groupByMerchant(offers) {
  const map = new Map();
  for (const o of offers) {
    if (!o.reward || !o.reward.trim()) continue;
    if (o.provider === "curve") continue;
    const name = normalizeName(o.merchantName);
    const key = name.toLowerCase();
    if (!map.has(key)) map.set(key, { name, domains: [], offers: [] });
    const m = map.get(key);
    // Prefer a nicely capitalized name (not all-caps, not all-lower)
    const current = m.name;
    if (current === current.toLowerCase() || current === current.toUpperCase()) {
      if (name !== name.toLowerCase() && name !== name.toUpperCase()) {
        m.name = name;
      }
    }
    for (const d of (o.domains || [])) {
      if (!m.domains.includes(d)) m.domains.push(d);
    }
    m.offers.push(o);
  }
  const merchants = [...map.values()];
  for (const m of merchants) {
    m.offers.sort((a, b) => getMaxPct(b) - getMaxPct(a));
  }
  return merchants.sort((a, b) => a.name.localeCompare(b.name, "nb"));
}

function render(query) {
  const q = query.trim().toLowerCase();
  const filtered = q.length === 0
    ? allMerchants
    : allMerchants.filter(m =>
        m.name.toLowerCase().includes(q) ||
        m.domains.some(d => d.includes(q))
      );

  const countEl = document.querySelector(".count");
  countEl.textContent = q.length > 0
    ? `${filtered.length} av ${allMerchants.length} butikker`
    : `${allMerchants.length} butikker`;

  const container = document.querySelector(".results");
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">Ingen treff</div>';
    return;
  }

  container.innerHTML = filtered.map(m => {
    const key = m.name.toLowerCase();
    const domain = m.domains.find(d => !d.includes("sjv.io") && !d.includes("emjcd.com")) || m.domains[0] || "";
    const hasIcon = domain.length > 0;
    const letter = esc(m.name.charAt(0).toUpperCase());
    const iconHtml = hasIcon
      ? `<img class="merchant-icon" src="https://icons.duckduckgo.com/ip3/${encodeURIComponent(domain)}.ico" alt="" loading="lazy" onerror="this.onerror=null;this.src='https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64'">`
      : `<span class="merchant-icon merchant-icon-fallback">${letter}</span>`;
    const offerHtml = m.offers.map(o => {
      const url = o.provider === "trumf" ? o.sourceUrl : o.activationUrl;
      const label = currentAmount > 0 ? calcReward(o, currentAmount) : formatReward(o);
      const terms = o.terms || "";
      const hasBreakdown = terms.includes("\n") && /\d+.*%/.test(terms);
      const tipText = hasBreakdown
        ? (currentAmount > 0 ? formatBreakdownWithAmounts(terms, currentAmount) : terms)
        : (PROVIDER_TIPS[o.provider] || "");
      const tooltipHtml = tipText ? `<span class="offer-tooltip">${esc(tipText)}</span>` : "";
      return `<span class="offer-wrap">${tooltipHtml}<a class="offer" href="${esc(url)}" target="_blank" rel="noreferrer">
        <span class="offer-reward">${esc(label)}</span>
        <span class="badge badge-${o.provider}">${esc(PROVIDER_NAMES[o.provider] || o.provider)}</span>
      </a></span>`;
    }).join("");
    return `<div class="merchant">
      <div class="merchant-header">
        ${iconHtml}
        <span class="merchant-name">${esc(m.name)}</span>
      </div>
      <div class="offers">${offerHtml}</div>
    </div>`;
  }).join("");
}

function formatReward(o) {
  const r = o.reward.trim();
  if (o.provider === "sas") {
    const rate = r.match(/^([\d\s]+)\s*poeng\s+per\s+100\s*kr$/i);
    if (rate) {
      const p = parseInt(rate[1].replace(/\s/g, ""), 10);
      return `~${(p / EB_PER_TRUMF_KR).toFixed(1).replace(".", ",")} % (~${p} EB/100kr)`;
    }
    const fixed = r.match(/^([\d\s]+)\s*poeng$/i);
    if (fixed) {
      const p = parseInt(fixed[1].replace(/\s/g, ""), 10);
      return `~${Math.round(p / EB_PER_TRUMF_KR)} kr (~${p.toLocaleString("nb-NO")} EB)`;
    }
  }
  if (o.provider === "trumf") {
    const range = r.match(/^([\d,]+)-([\d,]+)\s*%$/);
    if (range) {
      const min = parseFloat(range[1].replace(",", "."));
      const max = parseFloat(range[2].replace(",", "."));
      return `${r} (~${Math.round(min * EB_PER_TRUMF_KR)}-${Math.round(max * EB_PER_TRUMF_KR)} EB/100kr)`;
    }
    const pct = r.match(/^([\d,]+)\s*%$/);
    if (pct) {
      const p = parseFloat(pct[1].replace(",", "."));
      return `${r} (~${Math.round(p * EB_PER_TRUMF_KR)} EB/100kr)`;
    }
  }
  return r;
}

function formatKr(n) {
  return n.toFixed(2).replace(".", ",").replace(/,00$/, "");
}

function formatBreakdownWithAmounts(terms, amount) {
  return terms.split("\n").map(line => {
    const m = line.match(/^([\d,]+)\s*%/);
    if (m) {
      const pct = parseFloat(m[1].replace(",", "."));
      const kr = amount * pct / 100;
      return `${line} (${formatKr(kr)} kr)`;
    }
    return line;
  }).join("\n");
}

function calcReward(o, amount) {
  const r = o.reward.trim();
  const fmt = (n) => n.toFixed(2).replace(".", ",").replace(/,00$/, "");
  // range percent
  const range = r.match(/^([\d,]+)-([\d,]+)\s*%$/);
  if (range) {
    const min = parseFloat(range[1].replace(",", "."));
    const max = parseFloat(range[2].replace(",", "."));
    const minKr = amount * min / 100;
    const maxKr = amount * max / 100;
    if (o.provider === "trumf") {
      const minEb = Math.round(amount * min * EB_PER_TRUMF_KR / 100);
      const maxEb = Math.round(amount * max * EB_PER_TRUMF_KR / 100);
      return `${fmt(minKr)}-${fmt(maxKr)} kr (~${minEb}-${maxEb} EB)`;
    }
    return `${fmt(minKr)}-${fmt(maxKr)} kr`;
  }
  // single percent
  const pct = r.match(/^([\d,]+)\s*%$/);
  if (pct) {
    const p = parseFloat(pct[1].replace(",", "."));
    const kr = amount * p / 100;
    if (o.provider === "trumf") {
      const eb = Math.round(amount * p * EB_PER_TRUMF_KR / 100);
      return `${fmt(kr)} kr (~${eb} EB)`;
    }
    return `${fmt(kr)} kr`;
  }
  // SAS rate
  const sas = r.match(/^([\d\s]+)\s*poeng\s+per\s+100\s*kr$/i);
  if (sas) {
    const pts = parseInt(sas[1].replace(/\s/g, ""), 10);
    const eb = Math.round(amount * pts / 100);
    const kr = eb / EB_PER_TRUMF_KR;
    return `~${fmt(kr)} kr (~${eb} EB)`;
  }
  // SAS fixed
  const sasFixed = r.match(/^([\d\s]+)\s*poeng$/i);
  if (sasFixed) {
    const pts = parseInt(sasFixed[1].replace(/\s/g, ""), 10);
    return `~${Math.round(pts / EB_PER_TRUMF_KR)} kr (~${pts.toLocaleString("nb-NO")} EB)`;
  }
  return r;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function renderTips() {
  const container = document.querySelector(".tips");
  container.innerHTML = SUPPORT_LINKS.slice(0, 3).map(t =>
    `<a class="tip" href="${esc(t.url)}" target="_blank" rel="noreferrer">
      <span class="tip-emoji">${t.emoji}</span>
      <span class="tip-text">${esc(t.text.replace(/ →$/, ''))}</span>
    </a>`
  ).join("");
}

function renderChipGroup(cards, container) {
  container.innerHTML = cards.map(c => {
    const amt = currentAmount > 0 ? currentAmount : 0;
    let rewardText;
    if (amt > 0) {
      const kr = Math.round(amt * c.pct);
      rewardText = c.approx ? `+~${kr} kr` : `+${kr} kr`;
    } else {
      const pctStr = (c.pct * 100).toFixed(2).replace(".", ",").replace(/0$/, "");
      rewardText = c.approx ? `+~${pctStr}%` : `+${pctStr}%`;
    }
    return `<span class="tooltip-wrap">
      <span class="tooltip">${esc(c.tip)}</span>
      <a class="bonus-chip" href="${esc(c.url)}" target="_blank" rel="noreferrer">
        ${rewardText} <span class="badge badge-${c.badge}">${esc(c.label)}</span>
      </a>
    </span>`;
  }).join("");
}

function renderBonusChips() {
  renderChipGroup(FREE_CARDS, document.getElementById("free-chips"));
  renderChipGroup(PREMIUM_CARDS, document.getElementById("premium-chips"));
}

function setupBonusToggle() {
  const btn = document.querySelector(".bonus-toggle");
  const chips = document.querySelector(".bonus-chips");
  renderBonusChips();
  btn.addEventListener("click", () => {
    const open = chips.style.display !== "none";
    chips.style.display = open ? "none" : "flex";
    btn.classList.toggle("open", !open);
  });

  // Tap-to-show tooltips on mobile (bonus chips only)
  document.addEventListener("click", (e) => {
    const wrap = e.target.closest(".tooltip-wrap");
    document.querySelectorAll(".tooltip-wrap.active").forEach(el => {
      if (el !== wrap) el.classList.remove("active");
    });
    if (wrap) {
      wrap.classList.toggle("active");
    }
  });
}

init();
</script>
</body>
</html>
