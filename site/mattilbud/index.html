<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mattilbud · Cashback Norge</title>
<script src="/theme.js?v=3"></script>
<meta name="description" content="Ukens tilbud fra kundeavisene til REMA 1000, KIWI, MENY, Coop, SPAR, Joker, Bunnpris og flere – søk og sammenlign uten å bla i hele avisen.">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=quokka-1">
<link rel="icon" type="image/png" href="/favicon.png?v=quokka-1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--cbn-bg, #f7faf8);
  color: var(--cbn-text, #172026);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 56px; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--cbn-accent, #3a7d55); text-decoration: none; font-size: 14px; font-weight: 600; margin-bottom: 18px; }
.back:hover { text-decoration: underline; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.brand img { width: 44px; height: 44px; }
.brand h1 { font-size: 24px; flex: 1; }
.intro { color: var(--cbn-muted, #5d6b71); font-size: 14px; margin-bottom: 18px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.controls .cbn-field { flex: 1 1 260px; min-width: 0; font-size: 15px; padding: 10px 12px; }
.controls select { flex: 0 0 auto; font-size: 14px; padding: 9px 10px; }
.chains { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chains button { font-size: 13px; padding: 5px 10px; cursor: pointer; }
.status { color: var(--cbn-muted, #5d6b71); font-size: 13px; margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.offer { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
.offer-image { aspect-ratio: 4 / 3; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--cbn-border, #d6e1dc); }
.offer-image img { max-width: 100%; max-height: 100%; object-fit: contain; }
.offer-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.offer-chain { font-size: 12px; font-weight: 700; color: var(--cbn-muted, #5d6b71); text-transform: uppercase; letter-spacing: .02em; }
.offer-heading { font-size: 15px; font-weight: 700; line-height: 1.3; }
.offer-description { font-size: 12px; color: var(--cbn-muted, #5d6b71); white-space: pre-line; }
.offer-price { display: flex; align-items: baseline; gap: 8px; margin-top: auto; padding-top: 6px; flex-wrap: wrap; }
.offer-price strong { font-size: 20px; color: var(--cbn-accent, #22794f); }
.offer-price s { font-size: 13px; color: var(--cbn-subtle, #8a9a92); }
.offer-saving { font-size: 12px; font-weight: 700; color: var(--cbn-accent, #22794f); }
.offer-valid { font-size: 12px; color: var(--cbn-subtle, #8a9a92); }
.more { display: block; margin: 18px auto 0; padding: 10px 18px; font-size: 14px; cursor: pointer; }
.more[hidden] { display: none; }
.note { font-size: 12px; color: var(--cbn-subtle, #8a9a92); margin-top: 24px; }
footer.pagefoot { text-align: center; margin-top: 36px; font-size: 12px; color: var(--cbn-subtle, #8a9a92); }
footer.pagefoot a { color: var(--cbn-muted, #5d6b71); }
@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .offer-heading { font-size: 14px; }
  .offer-price strong { font-size: 17px; }
}
</style>
<script data-goatcounter="https://cashbacknorge.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Tilbake til Cashback Norge</a>
  <div class="brand">
    <img src="/logo.png?v=quokka-1" alt="">
    <h1>Mattilbud</h1>
    <span data-theme-control></span>
  </div>
  <p class="intro">Ukens tilbud fra kundeavisene, uten å bla i hele avisen. Søk etter en vare eller velg kjede.</p>
  <div class="controls">
    <input class="cbn-field" id="search" type="search" placeholder="Søk, f.eks. kaviar, kaffe eller grandiosa" autocomplete="off" aria-label="Søk i mattilbud">
    <select class="cbn-field" id="sort" aria-label="Sorter">
      <option value="relevance">Mest relevant</option>
      <option value="price">Lavest pris</option>
      <option value="saving">Størst rabatt</option>
      <option value="ending">Utløper først</option>
    </select>
  </div>
  <div class="chains" id="chains" role="group" aria-label="Kjeder"></div>
  <p class="status" id="status">Laster tilbud …</p>
  <div class="grid" id="grid"></div>
  <button class="cbn-button more" id="more" type="button" hidden>Vis flere</button>
  <p class="note" id="note"></p>
  <footer class="pagefoot">
    <a href="/">Hjem</a> · <a href="/mattilbud/">Mattilbud</a> · <a href="/om-oss/">Om oss</a> · <a href="/informasjonskapsler/">Informasjonskapsler</a>
  </footer>
</div>
<script>
// Data: /grocery-offers.json, built daily from Tjek's offer data (the data behind etilbudsavis.no).
const PAGE = 48;
const state = { offers: [], chain: "", query: "", sort: "relevance", shown: PAGE };
const $ = (id) => document.getElementById(id);

function esc(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}
function normalize(value) {
  return String(value).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/æ/g, "ae").replace(/ø/g, "o").replace(/å/g, "a");
}
function formatKr(amount) {
  return (Number.isInteger(amount) ? String(amount) : amount.toFixed(2).replace(".", ",").replace(/,00$/, "")) + " kr";
}
function formatDate(iso) {
  const date = new Date(iso);
  return Number.isNaN(date.getTime()) ? "" : new Intl.DateTimeFormat("nb-NO", { day: "numeric", month: "short", timeZone: "Europe/Oslo" }).format(date).replace(/\.$/, "");
}
// Flyer headings are often in capitals ("MILLS KAVIAR TUBE").
function formatHeading(heading) {
  return heading === heading.toUpperCase() ? heading.toLowerCase().replace(/(^|\s)(\p{L})/gu, (m, s, l) => s + l.toUpperCase()) : heading;
}
function savingPercent(offer) {
  return offer.prePrice > offer.amount ? Math.round((1 - offer.amount / offer.prePrice) * 100) : 0;
}

function matches(offer, words) {
  const text = normalize(`${offer.heading} ${offer.description} ${offer.chain}`);
  return words.every((word) => text.includes(word));
}
function relevance(offer, words) {
  const heading = normalize(offer.heading);
  return words.reduce((score, word) => score + (heading.startsWith(word) ? 3 : heading.includes(word) ? 2 : 1), 0);
}

function render() {
  const now = Date.now();
  const words = normalize(state.query).split(/\s+/).filter(Boolean);
  let list = state.offers.filter((offer) => Date.parse(offer.validTo) >= now && Date.parse(offer.validFrom) <= now);
  if (state.chain) list = list.filter((offer) => offer.chain === state.chain);
  if (words.length) list = list.filter((offer) => matches(offer, words));
  const sorters = {
    relevance: (a, b) => (words.length ? relevance(b, words) - relevance(a, words) : 0) || savingPercent(b) - savingPercent(a) || a.amount - b.amount,
    price: (a, b) => a.amount - b.amount,
    saving: (a, b) => savingPercent(b) - savingPercent(a) || a.amount - b.amount,
    ending: (a, b) => Date.parse(a.validTo) - Date.parse(b.validTo),
  };
  list.sort(sorters[state.sort] || sorters.relevance);
  $("status").textContent = list.length === 0
    ? (words.length ? `Ingen tilbud på «${state.query}» akkurat nå.` : "Ingen tilbud akkurat nå.")
    : `${list.length} tilbud${state.chain ? ` hos ${state.chain}` : ""}${words.length ? ` på «${state.query}»` : ""}`;
  $("grid").innerHTML = list.slice(0, state.shown).map((offer) => {
    const saving = savingPercent(offer);
    const image = offer.imageUrl
      ? `<div class="offer-image"><img src="${esc(offer.imageUrl)}" alt="${esc(formatHeading(offer.heading))}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></div>`
      : "";
    return `<article class="cbn-card offer">${image}<div class="offer-body">
      <span class="offer-chain">${esc(offer.chain)}</span>
      <span class="offer-heading">${esc(formatHeading(offer.heading))}</span>
      ${offer.description ? `<span class="offer-description">${esc(offer.description)}</span>` : ""}
      <span class="offer-price"><strong>${esc(formatKr(offer.amount))}</strong>${offer.prePrice ? `<s>${esc(formatKr(offer.prePrice))}</s>` : ""}${saving > 0 ? `<span class="offer-saving">−${saving} %</span>` : ""}</span>
      <span class="offer-valid">Gyldig t.o.m. ${esc(formatDate(offer.validTo))}</span>
    </div></article>`;
  }).join("");
  $("more").hidden = list.length <= state.shown;
}

function renderChains() {
  const counts = new Map();
  const now = Date.now();
  for (const offer of state.offers) {
    if (Date.parse(offer.validTo) >= now && Date.parse(offer.validFrom) <= now) counts.set(offer.chain, (counts.get(offer.chain) || 0) + 1);
  }
  const chains = [...counts.keys()].sort((a, b) => a.localeCompare(b, "nb"));
  $("chains").innerHTML = [`<button class="cbn-button" type="button" data-chain="" aria-pressed="${state.chain === ""}">Alle</button>`]
    .concat(chains.map((chain) => `<button class="cbn-button" type="button" data-chain="${esc(chain)}" aria-pressed="${state.chain === chain}">${esc(chain)} (${counts.get(chain)})</button>`))
    .join("");
}

$("chains").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-chain]");
  if (!button) return;
  state.chain = button.dataset.chain;
  state.shown = PAGE;
  renderChains();
  render();
  syncUrl();
});
let searchTimer;
$("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.query = $("search").value.trim(); state.shown = PAGE; render(); syncUrl(); }, 150);
});
$("sort").addEventListener("change", () => { state.sort = $("sort").value; render(); });
$("more").addEventListener("click", () => { state.shown += PAGE; render(); });

function syncUrl() {
  const params = new URLSearchParams();
  if (state.query) params.set("q", state.query);
  if (state.chain) params.set("kjede", state.chain);
  history.replaceState(null, "", `${location.pathname}${params.toString() ? `?${params}` : ""}`);
}

(async () => {
  const params = new URLSearchParams(location.search);
  state.query = params.get("q") || "";
  state.chain = params.get("kjede") || "";
  $("search").value = state.query;
  try {
    const response = await fetch("/grocery-offers.json", { cache: "no-cache" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const catalog = await response.json();
    state.offers = Array.isArray(catalog.offers) ? catalog.offers.filter((offer) => typeof offer.amount === "number" && offer.amount > 0) : [];
    $("note").textContent = `Kilde: kundeavisene via etilbudsavis.no (Tjek), oppdatert ${formatDate(catalog.generatedAt)}. Priser fra avisene for ${catalog.location || "Oslo"}-området; tilbud kan variere mellom regioner og butikker og gjelder så langt lageret rekker.`;
    renderChains();
    render();
  } catch (error) {
    $("status").textContent = "Klarte ikke å hente tilbudene akkurat nå. Prøv igjen senere.";
  }
})();
</script>
</body>
</html>
